name: ping render demo

# Render's free tier stops a service after 15 minutes without traffic.
# A request every 10 minutes keeps SafeDesk awake (one service fits in the free 750 hours a month).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping SafeDesk
        run: curl --fail --silent --show-error --max-time 120 --retry 2 --retry-delay 10 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" https://safedesk-agent.onrender.com
